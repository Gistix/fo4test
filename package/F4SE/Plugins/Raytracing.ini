[Settings]

; Denoiser mode to use for raytracing:
; DLSS_RR      - NVIDIA DLSS 3.5 Ray Reconstruction (Neural Denoiser + Upscaler)
; NRD_Reblur   - NVIDIA Real-Time Denoisers (REBLUR)
; NRD_Relax    - NVIDIA Real-Time Denoisers (RELAX)
; Accumulation - Temporal accumulation only
; None         - No denoising (raw raytracing output)
sDenoiser=NRD_Reblur

; DLSS Ray Reconstruction model preset: D, E, or F
sDLSS_RR_Preset=F
