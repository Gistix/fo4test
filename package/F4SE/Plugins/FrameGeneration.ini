[Settings]

; Enable frame generation
bFrameGenerationMode=false

; Enable frame rate limiting if VSync is disabled
bFrameLimitMode=false

; Virtual key code for GPU capture hotkey (default: 122 = F11, 0 = disabled)
uCaptureHotkey=122

; Enable PIX GPU capture (only one of PIX or RenderDoc can be enabled at once)
bEnablePIX=false

; Enable RenderDoc in-application frame capture (only one of PIX or RenderDoc can be enabled at once)
bEnableRenderDoc=false

; Enable the D3D12 debug layer and GPU-based validation
bEnableD3D12Debug=false
